services:
  ros:
    build: .
    image: float_forward-ros:jazzy
    volumes:
      - .:/ws/src/boat          # BIND: this repo, edit on the host, live in the container
      - ros-build:/ws/build     # NAMED: colcon scratch, survives `compose down`
      - ros-install:/ws/install # NAMED: the overlay ROS actually loads
      - ros-log:/ws/log         # NAMED: build/test logs
    working_dir: /ws
    stdin_open: true
    tty: true
    shm_size: "512mb"           # Gazebo's Ogre2 renderer + Xvfb need more than Docker's 64MB default /dev/shm
    ports:
      - "127.0.0.1:6080:6080"   # noVNC web UI — loopback-only: the VNC server has no password

volumes:
  ros-build:
  ros-install:
  ros-log:
