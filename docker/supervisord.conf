[supervisord]
nodaemon=false
pidfile=/tmp/supervisord.pid
logfile=/tmp/supervisord.log
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24 -nolisten tcp
priority=10
autorestart=true
startretries=3
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.log

[program:fluxbox]
command=/usr/bin/fluxbox -display :1
environment=DISPLAY=":1"
priority=20
autorestart=true
startretries=3
stdout_logfile=/tmp/fluxbox.log
stderr_logfile=/tmp/fluxbox.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -rfbport 5900 -xkb -noxdamage
priority=20
autorestart=true
startretries=3
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.log

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=30
autorestart=true
startretries=3
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc.log
