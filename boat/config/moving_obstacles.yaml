# Editable test obstacles in Gazebo world coordinates (x east, y north, metres).
# They are visible, collidable spheres and are included in both ROS outputs.
obstacles:
  - name: moving_obstacle_1
    classification: simulated_obstacle
    radius_m: 1.2
    speed_mps: 1.0
    loop: true
    waypoints_xy:
      - [-500.0, 170.0]
      - [-480.0, 170.0]
      - [-480.0, 190.0]
      - [-500.0, 190.0]
  # Drives onto the demo route and stops; the world model then adds it to the
  # static map and the global planner routes around it.
  - name: stopping_obstacle_1
    classification: simulated_obstacle
    radius_m: 2.0
    speed_mps: 0.5
    loop: false
    waypoints_xy:
      - [-545.0, 210.0]
      - [-556.0, 200.0]
