# Which sensors the boat carries and where they are mounted (VRX's component
# format). Add, remove or move entries here; what each sensor measures (rate,
# resolution, range, noise) is set in boat_params.yaml.
#
# x/y/z are metres from the boat's centre (x forward, y to port, z up).
# R/P/Y are roll/pitch/yaw in radians; ${radians(15)} converts from degrees.
# VRX allows at most 3 cameras, 2 lidars, 1 GPS and 1 IMU.

wamv_camera:
  - name: front_left_camera
    x: 0.75
    y: 0.1
    z: 1.5
    P: ${radians(15)}
  - name: front_right_camera
    x: 0.75
    y: -0.1
    z: 1.5
    P: ${radians(15)}
  - name: far_left_camera
    x: 0.75
    y: 0.3
    z: 1.5
    P: ${radians(15)}

lidar:
  - name: lidar_wamv
    type: 16_beam
    x: 0.7
    y: 0.0
    z: 1.8
    P: ${radians(8)}

wamv_gps:
  - name: gps_wamv
    x: -0.85
    y: 0.0
    z: 1.3

wamv_imu:
  - name: imu_wamv
    x: 0.3
    y: -0.2
    z: 1.3
